esphome:
  name: esp32-bieznia
  friendly_name: ESP32_Bieznia
  comment: BLE Bieznia

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: INFO

api:
ota:
  - platform: esphome
    password: !secret ota_password

interval:
  - interval: 500ms
    then:
      - ble_server.characteristic.notify:
          id: garmin_rsc_measurement

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  manual_ip:
    static_ip: !secret device_ip
    gateway: !secret gateway_ip
    subnet: !secret subnet_mask

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 500ms
    active: true
    # ESP32 startuje razem z bieżnią, więc skanowanie uruchamia się od razu.
    continuous: true

ble_client:
  - mac_address: !secret t900d_mac
    id: t900d
    auto_connect: true

    on_connect:
      then:
        - binary_sensor.template.publish:
            id: t900d_connected
            state: ON

        - logger.log:
            level: INFO
            format: "T900D: POŁĄCZONO AUTOMATYCZNIE"

        # Po zestawieniu połączenia zatrzymujemy zbędne skanowanie.
        - esp32_ble_tracker.stop_scan:

        # Po połączeniu pięć razy wysyłamy F0 CD.
        # Ta sekwencja pozwala zachować komunikację FTMS bez blokowania
        # normalnego ekranu bieżni przez tryb BLE.
        - delay: 1500ms

        - logger.log:
            level: INFO
            format: "T900D: aktywacja trybu BLE/LCD 1/5"
        - button.press: t900d_unlock_ble_lcd

        - delay: 1500ms
        - logger.log:
            level: INFO
            format: "T900D: aktywacja trybu BLE/LCD 2/5"
        - button.press: t900d_unlock_ble_lcd

        - delay: 1500ms
        - logger.log:
            level: INFO
            format: "T900D: aktywacja trybu BLE/LCD 3/5"
        - button.press: t900d_unlock_ble_lcd

        - delay: 1500ms
        - logger.log:
            level: INFO
            format: "T900D: aktywacja trybu BLE/LCD 4/5"
        - button.press: t900d_unlock_ble_lcd

        - delay: 1500ms
        - logger.log:
            level: INFO
            format: "T900D: aktywacja trybu BLE/LCD 5/5"
        - button.press: t900d_unlock_ble_lcd

        - logger.log:
            level: INFO
            format: "T900D: tryb BLE/LCD aktywowany"

    on_disconnect:
      then:
        - binary_sensor.template.publish:
            id: t900d_connected
            state: OFF

        - logger.log:
            level: WARN
            format: "T900D: ROZŁĄCZONO - ponawiam wyszukiwanie"

        - esp32_ble_tracker.start_scan:
            continuous: true

binary_sensor:
  - platform: template
    name: "T900D Połączona"
    id: t900d_connected
    device_class: connectivity


# ============================================================
# DOMYOS - AKTYWACJA TRYBU BLE/LCD
# ============================================================
# Ramka F0 CD jest wysyłana przez vendorowy kanał Domyosa.
# Po połączeniu wykonywana jest automatycznie 5 razy.
# Przycisk w HA pozwala ręcznie ponowić sekwencję.
# Zapis jest dozwolony tylko przy zatrzymanym pasie.

button:
  - platform: restart
    name: Restart

  - platform: template
    name: "T900D Aktywuj BLE/LCD"
    id: t900d_unlock_ble_lcd
    icon: "mdi:counter"

    on_press:
      - if:
          condition:
            lambda: |-
              if (!id(t900d_connected).state)
                return false;

              float speed = id(t900d_speed).state;
              float distance = id(t900d_distance).state;

              if (isnan(speed) || isnan(distance))
                return false;

              return speed <= 0.05f && distance >= 0.0f;

          then:
            - logger.log:
                level: WARN
                format: "T900D LCD: wysyłam ramkę F0 CD"

            # Pierwsze 20 bajtów ramki F0 CD.
            - ble_client.ble_write:
                id: t900d
                service_uuid: "49535343-FE7D-4AE5-8FA9-9FAFD205E455"
                characteristic_uuid: "49535343-8841-43F4-A8D4-ECBE34729BB3"
                value: !lambda |-
                  std::vector<uint8_t> frame = {
                    0xF0, 0xCD, 0x01, 0x00, 0x00, 0x01,
                    0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
                    0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
                    0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00
                  };

                  float km = id(t900d_distance).state;
                  uint16_t dist_x10 = (uint16_t) roundf(km * 10.0f);

                  frame[3] = (dist_x10 >> 8) & 0xFF;
                  frame[4] = dist_x10 & 0xFF;

                  uint8_t checksum = 0;
                  for (size_t i = 0; i < 26; i++)
                    checksum += frame[i];

                  frame[26] = checksum;

                  ESP_LOGI(
                    "T900D_LCD",
                    "F0 CD dystans=%.3f km, kod=%u, checksum=0x%02X, część 1/2",
                    km,
                    dist_x10,
                    checksum
                  );

                  return std::vector<uint8_t>(frame.begin(), frame.begin() + 20);

            - delay: 150ms

            # Pozostałe 7 bajtów ramki.
            - ble_client.ble_write:
                id: t900d
                service_uuid: "49535343-FE7D-4AE5-8FA9-9FAFD205E455"
                characteristic_uuid: "49535343-8841-43F4-A8D4-ECBE34729BB3"
                value: !lambda |-
                  std::vector<uint8_t> frame = {
                    0xF0, 0xCD, 0x01, 0x00, 0x00, 0x01,
                    0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
                    0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
                    0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00
                  };

                  float km = id(t900d_distance).state;
                  uint16_t dist_x10 = (uint16_t) roundf(km * 10.0f);

                  frame[3] = (dist_x10 >> 8) & 0xFF;
                  frame[4] = dist_x10 & 0xFF;

                  uint8_t checksum = 0;
                  for (size_t i = 0; i < 26; i++)
                    checksum += frame[i];

                  frame[26] = checksum;

                  ESP_LOGI(
                    "T900D_LCD",
                    "F0 CD dystans=%.3f km, kod=%u, checksum=0x%02X, część 2/2",
                    km,
                    dist_x10,
                    checksum
                  );

                  return std::vector<uint8_t>(frame.begin() + 20, frame.end());

            - logger.log:
                level: INFO
                format: "T900D LCD: ramka F0 CD wysłana"

          else:
            - logger.log:
                level: ERROR
                format: "T900D LCD: zapis odrzucony - bieżnia musi być połączona, a pas zatrzymany"


# ============================================================
# ZMIENNE WEWNĘTRZNE - DYSTANS / SESJA
# ============================================================

globals:
  - id: t900d_distance_calc_km
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: t900d_last_packet_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: t900d_prev_speed_kmh
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: t900d_last_elapsed_s
    type: uint16_t
    restore_value: no
    initial_value: '0'

  - id: t900d_ftms_distance_valid
    type: bool
    restore_value: no
    initial_value: 'false'

# ============================================================
# GARMIN - BLE RUNNING SPEED AND CADENCE SENSOR
# ============================================================

esp32_ble_server:
  manufacturer: "T900D-Bridge"

  on_connect:
    - logger.log:
        level: INFO
        format: "GARMIN: BLE połączony"

  on_disconnect:
    - logger.log:
        level: WARN
        format: "GARMIN: BLE rozłączony"

  services:

    # --------------------------------------------------------
    # Running Speed and Cadence Service
    # UUID 0x1814
    # --------------------------------------------------------
    - uuid: 0x1814
      advertise: true

      characteristics:

        # ====================================================
        # RSC Measurement
        # UUID 0x2A53
        # ====================================================
        - id: garmin_rsc_measurement
          uuid: 0x2A53
          notify: true

          value:
            data: !lambda |-
              std::vector<uint8_t> data;

              float kmh = id(t900d_speed).state;

              if (isnan(kmh) || kmh < 0.0f)
                kmh = 0.0f;

              float ms = kmh / 3.6f;
              uint16_t rsc_speed = (uint16_t) roundf(ms * 256.0f);

              // Dystans dla Garmina:
              // FTMS z bieżni, jeżeli faktycznie zacznie być > 0,
              // w przeciwnym razie dystans liczony przez ESP32.
              float distance_km = id(t900d_distance_calc_km);

              if (id(t900d_ftms_distance_valid)) {
                float ftms_km = id(t900d_distance).state;
                if (!isnan(ftms_km) && ftms_km >= 0.0f)
                  distance_km = ftms_km;
              }

              if (isnan(distance_km) || distance_km < 0.0f)
                distance_km = 0.0f;

              // RSC Total Distance: uint32, rozdzielczość 0.1 m.
              uint32_t rsc_distance =
                  (uint32_t) roundf(distance_km * 10000.0f);

              // bit 1 = Total Distance present
              // bit 2 = Walking/Running
              uint8_t flags = 0x02;

              if (kmh >= 7.0f)
                flags |= 0x04;

              data.push_back(flags);

              // Instantaneous Speed uint16 LE
              data.push_back(rsc_speed & 0xFF);
              data.push_back((rsc_speed >> 8) & 0xFF);

              // Cadence - T900D jej nie podaje.
              data.push_back(0);

              // Total Distance uint32 LE
              data.push_back(rsc_distance & 0xFF);
              data.push_back((rsc_distance >> 8) & 0xFF);
              data.push_back((rsc_distance >> 16) & 0xFF);
              data.push_back((rsc_distance >> 24) & 0xFF);

              return data;


        # ====================================================
        # RSC Feature
        # UUID 0x2A54
        #
        # 0x0002 = Total Distance Measurement Supported
        # 0x0004 = Walking/Running Status Supported
        # razem 0x0006
        # ====================================================
        - id: garmin_rsc_feature
          uuid: 0x2A54
          read: true

          value:
            data: [0x06, 0x00]


        # ====================================================
        # Sensor Location
        # UUID 0x2A5D
        #
        # 0x05 = Foot
        # ====================================================
        - id: garmin_sensor_location
          uuid: 0x2A5D
          read: true

          value:
            data: [0x05]


# ============================================================
# SENSORY TEKSTOWE
# ============================================================

text_sensor:
  - platform: template
    name: "T900D Czas treningu HH:MM:SS"
    id: t900d_elapsed_hms
    icon: "mdi:timer-outline"
    update_interval: never

  - platform: template
    name: "Uptime Sensor (formatted)"
    lambda: |-
      uint32_t dur = id(uptime_s).state;
      int dys = 0;
      int hrs = 0;
      int mnts = 0;
      if (dur > 86399) {
        dys = trunc(dur / 86400);
        dur = dur - (dys * 86400);
      }
      if (dur > 3599) {
        hrs = trunc(dur / 3600);
        dur = dur - (hrs * 3600);
      }
      if (dur > 59) {
        mnts = trunc(dur / 60);
        dur = dur - (mnts * 60);
      }
      char buffer[17];
      sprintf(buffer, "%ud %02uh %02um %02us", dys, hrs, mnts, dur);
      return {buffer};
    icon: mdi:clock-start
    update_interval: 15s
    entity_category: "diagnostic"

  - platform: version
    name: "Version"
    icon: mdi:cube-outline


sensor:

  # ==========================================================
  # DANE T900D
  # ==========================================================

  - platform: template
    name: "T900D Prędkość"
    id: t900d_speed
    unit_of_measurement: "km/h"
    accuracy_decimals: 2
    device_class: speed
    state_class: measurement

  - platform: template
    name: "T900D Tempo"
    id: t900d_pace
    unit_of_measurement: "min/km"
    accuracy_decimals: 2
    state_class: measurement

  - platform: template
    name: "T900D Dystans FTMS"
    id: t900d_distance
    unit_of_measurement: "km"
    accuracy_decimals: 3
    device_class: distance
    state_class: measurement

  - platform: template
    name: "T900D Dystans ESP"
    id: t900d_distance_calc
    unit_of_measurement: "km"
    accuracy_decimals: 3
    device_class: distance
    state_class: measurement

  - platform: template
    name: "T900D Dystans Garmin"
    id: t900d_distance_garmin
    unit_of_measurement: "km"
    accuracy_decimals: 3
    device_class: distance
    state_class: measurement

  - platform: template
    name: "T900D Nachylenie"
    id: t900d_incline
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "T900D Kąt rampy"
    id: t900d_ramp_angle
    unit_of_measurement: "°"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "T900D Energia"
    id: t900d_energy
    unit_of_measurement: "kcal"
    accuracy_decimals: 0
    state_class: total_increasing

  - platform: template
    name: "T900D Energia na godzinę"
    id: t900d_energy_hour
    unit_of_measurement: "kcal/h"
    accuracy_decimals: 0
    state_class: measurement

  - platform: template
    name: "T900D Energia na minutę"
    id: t900d_energy_minute
    unit_of_measurement: "kcal/min"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "T900D Tętno"
    id: t900d_hr
    unit_of_measurement: "bpm"
    accuracy_decimals: 0
    state_class: measurement

  - platform: template
    name: "T900D MET"
    id: t900d_met
    unit_of_measurement: "MET"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "T900D Czas treningu"
    id: t900d_elapsed
    unit_of_measurement: "s"
    accuracy_decimals: 0
    device_class: duration
    state_class: measurement


  # Vendorowy kanał Domyosa - subskrypcja NOTIFY.
  - platform: ble_client
    type: characteristic
    ble_client_id: t900d
    id: t900d_domyos_vendor_notify
    service_uuid: "49535343-FE7D-4AE5-8FA9-9FAFD205E455"
    characteristic_uuid: "49535343-1E4D-4BD9-BA61-23C647249616"
    notify: true
    update_interval: never
    internal: true
    lambda: |-
      return NAN;


  # ==========================================================
  # FTMS - TREADMILL DATA 0x2ACD
  # ==========================================================

  - platform: ble_client
    type: characteristic
    ble_client_id: t900d
    name: "T900D FTMS"
    id: t900d_ftms
    internal: true

    service_uuid: "1826"
    characteristic_uuid: "2ACD"

    notify: true
    update_interval: never

    lambda: |-
      if (x.size() < 4)
        return NAN;

      const uint32_t now_ms = millis();

      uint16_t flags =
          ((uint16_t)x[0]) |
          ((uint16_t)x[1] << 8);

      size_t p = 2;

      // ------------------------------------------------------
      // Instantaneous Speed
      //
      // FTMS ma dość dziwną zasadę:
      // bit 0 = More Data.
      //
      // Jeżeli bit 0 == 0, Instantaneous Speed jest obecna.
      // ------------------------------------------------------

      float speed = NAN;

      if (!(flags & 0x0001)) {

        if (p + 2 > x.size())
          return NAN;

        uint16_t raw =
            ((uint16_t)x[p]) |
            ((uint16_t)x[p + 1] << 8);

        speed = raw / 100.0f;
        p += 2;

        id(t900d_speed).publish_state(speed);

        if (speed > 0.05f)
          id(t900d_pace).publish_state(60.0f / speed);
        else
          id(t900d_pace).publish_state(NAN);

        // Dystans ESP32 - całkowanie po rzeczywistym czasie
        // pomiędzy pakietami, metodą trapezów.
        uint32_t last_ms = id(t900d_last_packet_ms);

        if (last_ms != 0U) {
          uint32_t dt_ms = now_ms - last_ms;

          // Nie doliczamy przerwy po utracie BLE / reconnect.
          if (dt_ms <= 2000U) {
            float prev_speed = id(t900d_prev_speed_kmh);
            if (isnan(prev_speed) || prev_speed < 0.0f)
              prev_speed = speed;

            float avg_speed = (prev_speed + speed) * 0.5f;

            if (avg_speed > 0.0f)
              id(t900d_distance_calc_km) +=
                  avg_speed * ((float) dt_ms / 3600000.0f);
          }
        }

        id(t900d_prev_speed_kmh) = speed;
        id(t900d_last_packet_ms) = now_ms;
        id(t900d_distance_calc).publish_state(id(t900d_distance_calc_km));
      }


      // ------------------------------------------------------
      // Average Speed
      // bit 1
      // ------------------------------------------------------

      if (flags & 0x0002) {
        if (p + 2 > x.size()) return speed;
        p += 2;
      }


      // ------------------------------------------------------
      // Total Distance
      // bit 2
      // uint24, jednostka = metr
      // ------------------------------------------------------

      if (flags & 0x0004) {

        if (p + 3 > x.size()) return speed;

        uint32_t distance_m =
            ((uint32_t)x[p]) |
            ((uint32_t)x[p + 1] << 8) |
            ((uint32_t)x[p + 2] << 16);

        float distance_km = distance_m / 1000.0f;
        id(t900d_distance).publish_state(distance_km);

        // Bieżnia ustawia flagę Total Distance nawet wtedy, gdy
        // wysyła 0. Za prawidłowe źródło uznajemy FTMS dopiero
        // po pierwszej niezerowej wartości.
        if (distance_m > 0U)
          id(t900d_ftms_distance_valid) = true;

        p += 3;
      }


      // ------------------------------------------------------
      // Inclination + Ramp Angle
      // bit 3
      //
      // Inclination: 0.1 %
      // Ramp angle: 0.1 stopnia
      // ------------------------------------------------------

      if (flags & 0x0008) {

        if (p + 4 > x.size()) return speed;

        int16_t incline_raw =
            ((int16_t)x[p]) |
            ((int16_t)x[p + 1] << 8);

        int16_t ramp_raw =
            ((int16_t)x[p + 2]) |
            ((int16_t)x[p + 3] << 8);

        id(t900d_incline).publish_state(
            incline_raw / 10.0f
        );

        id(t900d_ramp_angle).publish_state(
            ramp_raw / 10.0f
        );

        p += 4;
      }


      // ------------------------------------------------------
      // Elevation Gain
      // bit 4
      // 2 + 2 bajty
      // ------------------------------------------------------

      if (flags & 0x0010) {
        if (p + 4 > x.size()) return speed;
        p += 4;
      }


      // ------------------------------------------------------
      // Instantaneous Pace
      // bit 5
      // ------------------------------------------------------

      if (flags & 0x0020) {
        if (p + 1 > x.size()) return speed;
        p += 1;
      }


      // ------------------------------------------------------
      // Average Pace
      // bit 6
      // ------------------------------------------------------

      if (flags & 0x0040) {
        if (p + 1 > x.size()) return speed;
        p += 1;
      }


      // ------------------------------------------------------
      // Expended Energy
      // bit 7
      //
      // Total Energy      uint16 kcal
      // Energy/hour       uint16 kcal/h
      // Energy/minute     uint8 kcal/min
      // ------------------------------------------------------

      if (flags & 0x0080) {

        if (p + 5 > x.size()) return speed;

        uint16_t total_energy =
            ((uint16_t)x[p]) |
            ((uint16_t)x[p + 1] << 8);

        uint16_t energy_hour =
            ((uint16_t)x[p + 2]) |
            ((uint16_t)x[p + 3] << 8);

        uint8_t energy_minute = x[p + 4];

        id(t900d_energy).publish_state(total_energy);
        id(t900d_energy_hour).publish_state(energy_hour);
        id(t900d_energy_minute).publish_state(energy_minute);

        p += 5;
      }


      // ------------------------------------------------------
      // Heart Rate
      // bit 8
      // ------------------------------------------------------

      if (flags & 0x0100) {

        if (p + 1 > x.size()) return speed;

        id(t900d_hr).publish_state(x[p]);

        p += 1;
      }


      // ------------------------------------------------------
      // MET
      // bit 9
      // 0.1 MET
      // ------------------------------------------------------

      if (flags & 0x0200) {

        if (p + 1 > x.size()) return speed;

        id(t900d_met).publish_state(
            x[p] / 10.0f
        );

        p += 1;
      }


      // ------------------------------------------------------
      // Elapsed Time
      // bit 10
      // sekundy
      // ------------------------------------------------------

      if (flags & 0x0400) {

        if (p + 2 > x.size()) return speed;

        uint16_t elapsed =
            ((uint16_t)x[p]) |
            ((uint16_t)x[p + 1] << 8);

        id(t900d_elapsed).publish_state(elapsed);

        // Czytelny czas do HA: HH:MM:SS
        uint32_t hours = elapsed / 3600U;
        uint32_t minutes = (elapsed % 3600U) / 60U;
        uint32_t seconds = elapsed % 60U;

        char elapsed_buf[12];
        snprintf(
          elapsed_buf,
          sizeof(elapsed_buf),
          "%02u:%02u:%02u",
          (unsigned int) hours,
          (unsigned int) minutes,
          (unsigned int) seconds
        );

        id(t900d_elapsed_hms).publish_state(elapsed_buf);

        // Nowa sesja: licznik czasu bieżni się cofnął.
        uint16_t prev_elapsed = id(t900d_last_elapsed_s);

        if (prev_elapsed > 5U && elapsed < prev_elapsed) {
          ESP_LOGI(
            "T900D",
            "NOWA SESJA: elapsed %u -> %u, zeruję dystans ESP",
            prev_elapsed, elapsed
          );

          id(t900d_distance_calc_km) = 0.0f;
          id(t900d_distance_calc).publish_state(0.0f);
          id(t900d_distance_garmin).publish_state(0.0f);
          id(t900d_ftms_distance_valid) = false;
          id(t900d_last_packet_ms) = now_ms;

          if (!isnan(speed) && speed >= 0.0f)
            id(t900d_prev_speed_kmh) = speed;
          else
            id(t900d_prev_speed_kmh) = 0.0f;
        }

        id(t900d_last_elapsed_s) = elapsed;

        p += 2;
      }


      // ------------------------------------------------------
      // Remaining Time
      // bit 11
      // ------------------------------------------------------

      if (flags & 0x0800) {
        if (p + 2 > x.size()) return speed;
        p += 2;
      }


      // Dystans, który w tej chwili dostaje Garmin.
      float garmin_distance_km = id(t900d_distance_calc_km);

      if (id(t900d_ftms_distance_valid)) {
        float ftms_km = id(t900d_distance).state;
        if (!isnan(ftms_km) && ftms_km >= 0.0f)
          garmin_distance_km = ftms_km;
      }

      id(t900d_distance_garmin).publish_state(garmin_distance_km);


      return speed;

  - platform: internal_temperature
    name: "Internal Temperature"

  - platform: uptime
